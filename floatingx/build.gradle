plugins {
    alias(libs.plugins.android.lirary)
    alias(libs.plugins.jetbrains.kotlin.android)
}

android {
    namespace 'com.petterp.floatingx'

    compileSdk libs.versions.compileSdk.get().toInteger()

    defaultConfig {
        minSdk libs.versions.minSdk.get().toInteger()
        targetSdk libs.versions.targetSdk.get().toInteger()
        consumerProguardFiles "proguard-floatingx.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-floatingx.pro'
        }
    }
    compileOptions {
        def javeVersion = JavaVersion.toVersion(libs.versions.jvmTarget.get())
        sourceCompatibility javeVersion
        targetCompatibility javeVersion
    }
    buildFeatures {
        buildConfig = false
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.kotlin.stdlib
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}
