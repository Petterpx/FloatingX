name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew test --stacktrace
      - name: Assemble demo & instrumentation apk
        run: ./gradlew app:assembleDebug app:assembleDebugAndroidTest --stacktrace
      - name: Publish to maven local
        run: ./gradlew publishToMavenLocal -PisPublish=false -PversionName=3.0.0-SNAPSHOT --stacktrace

  instrumentation:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          force-avd-creation: false
          script: |
            ./gradlew app:installDebug app:installDebugAndroidTest
            adb shell appops set com.petterp.floatingx.app SYSTEM_ALERT_WINDOW allow
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            # CI 模拟器偶发（ANR / 系统弹窗抢焦点）：失败先留 logcat + 截图，再重跑一次
            run_tests() { adb logcat -c; ./gradlew app:connectedDebugAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true; }
            dump() { adb exec-out screencap -p > "app/build/ci-failure-$1.png"; adb logcat -d > "app/build/ci-logcat-$1.txt"; }
            run_tests || { dump 1; echo "::warning::connectedDebugAndroidTest 第一次失败，重跑一次"; run_tests || { dump 2; exit 1; }; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: androidTest-results
          path: |
            app/build/reports/androidTests
            app/build/ci-failure-*.png
            app/build/ci-logcat-*.txt
